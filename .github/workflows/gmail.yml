name: Gmail

# EMail against Google's own servers (tests/gmail_probe.sh): run by hand,
# Actions > Gmail > Run workflow. It logs in as no one and builds nothing
# that leaves the runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gmail:
    name: Direct connection and gateway to Gmail
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the test program
        run: make build/mail-cli
      - name: Gmail
        run: tests/gmail_probe.sh
